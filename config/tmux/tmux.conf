# Shell, terminal, and macOS integration.
set -g default-shell /bin/zsh
set -g default-command "/bin/zsh -l"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
# Ghostty supports extended keyboard sequences, allowing Tmux to distinguish
# Ctrl-Shift-H/L from the Ctrl-H/L pane-navigation keys used by Neovim.
set -as terminal-features ",xterm-ghostty:extkeys"
set -g extended-keys on
set -as terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard on
set -g escape-time 10
set -g focus-events on
set -g mouse on

# Prefix and configuration reload.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind R source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Start windows and panes at one and keep numbering compact.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Windows and panes.
bind -n C-S-H previous-window
bind -n C-S-L next-window
bind q kill-window
bind x kill-pane
bind c new-window -c "#{pane_current_path}"
unbind %
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
unbind ,
bind r command-prompt -p "New name:" "rename-window '%%'"

# Vi-style copy mode with native macOS clipboard integration.
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Find a project with fd/fzf and change the current pane's directory.
bind f display-popup -E -w 80% -h 80% \
  '"$HOME/.dotfiles/scripts/tmux/project-picker.sh"'

# Plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @yank_with_mouse on

# tmux-sessionx searches common macOS development roots.
set -g @sessionx-bind 'o'
set -g @sessionx-x-path "$HOME/.dotfiles"
set -g @sessionx-custom-paths "$HOME/Developer/*,$HOME/Projects/*,$HOME/Work/*"
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-ratio '25%'
set -g @sessionx-preview-location 'bottom'

# Initialize TPM synchronously when present. Keep this at the very bottom so
# every plugin declaration and option is available before TPM loads plugins.
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
